name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
# This public repository uses a personal, persistent runner. Only the owner can
# trigger these jobs, and PRs must originate from this same repository. Fork and
# external-contributor PRs cannot use this runner; review/import trusted changes
# into an owner-authored repository branch before requesting required CI.
jobs:
  build-and-test:
    if: github.repository == 'fernandobelotto/WindowCleaner' && github.repository_owner == 'fernandobelotto' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && github.actor == 'fernandobelotto' && (github.event_name != 'pull_request' || github.event.pull_request.user.login == 'fernandobelotto')
    name: Build & Test
    runs-on: [self-hosted, macOS, ARM64, ci-build, windowcleaner-build]
    timeout-minutes: 90

    defaults:
      run:
        shell: /opt/homebrew/bin/python3 /Users/fernando/ci-tools/serial-shell.py {0}
    env:
      DEVELOPER_DIR: /Users/fernando/ci-tools/Xcode.app/Contents/Developer
    steps:
      - name: Use provisioned build tools
        run: |
          echo /opt/homebrew/bin >> "$GITHUB_PATH"
          test -x "$DEVELOPER_DIR/usr/bin/xcodebuild"
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify provisioned Xcode
        run: |
          xcodebuild -version
          swift --version

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/WindowCleaner-DerivedData
          key: ${{ runner.os }}-windowcleaner-deriveddata-${{ hashFiles('**/*.swift', '**/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-windowcleaner-deriveddata-

      - name: Verify provisioned xcpretty
        run: command -v xcpretty

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project WindowCleaner.xcodeproj \
            -scheme WindowCleaner \
            -destination "platform=macOS" \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/WindowCleaner-DerivedData" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color

      - name: Run Tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project WindowCleaner.xcodeproj \
            -scheme WindowCleaner \
            -destination "platform=macOS" \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/WindowCleaner-DerivedData" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath TestResults.xcresult \
            | xcpretty --color --report junit --output test-results.xml

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: |
            TestResults.xcresult
            test-results.xml
          retention-days: 1

  lint:
    if: github.repository == 'fernandobelotto/WindowCleaner' && github.repository_owner == 'fernandobelotto' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && github.actor == 'fernandobelotto' && (github.event_name != 'pull_request' || github.event.pull_request.user.login == 'fernandobelotto')
    name: SwiftLint
    runs-on: [self-hosted, macOS, ARM64, ci-build, windowcleaner-build]
    timeout-minutes: 90

    defaults:
      run:
        shell: /opt/homebrew/bin/python3 /Users/fernando/ci-tools/serial-shell.py {0}
    env:
      DEVELOPER_DIR: /Users/fernando/ci-tools/Xcode.app/Contents/Developer
    steps:
      - name: Use provisioned build tools
        run: |
          echo /opt/homebrew/bin >> "$GITHUB_PATH"
          test -x "$DEVELOPER_DIR/usr/bin/xcodebuild"
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify provisioned SwiftLint
        run: swiftlint version

      - name: Run SwiftLint
        run: swiftlint --strict --reporter github-actions-logging

  format-check:
    if: github.repository == 'fernandobelotto/WindowCleaner' && github.repository_owner == 'fernandobelotto' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && github.actor == 'fernandobelotto' && (github.event_name != 'pull_request' || github.event.pull_request.user.login == 'fernandobelotto')
    name: Format Check
    runs-on: [self-hosted, macOS, ARM64, ci-build, windowcleaner-build]
    timeout-minutes: 90

    defaults:
      run:
        shell: /opt/homebrew/bin/python3 /Users/fernando/ci-tools/serial-shell.py {0}
    env:
      DEVELOPER_DIR: /Users/fernando/ci-tools/Xcode.app/Contents/Developer
    steps:
      - name: Use provisioned build tools
        run: |
          echo /opt/homebrew/bin >> "$GITHUB_PATH"
          test -x "$DEVELOPER_DIR/usr/bin/xcodebuild"
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify provisioned SwiftFormat
        run: swiftformat --version

      - name: Check Formatting
        run: |
          swiftformat --lint .
          if [ $? -ne 0 ]; then
            echo "::error::Code is not properly formatted. Run 'swiftformat .' locally and commit the changes."
            exit 1
          fi

